<div class="container-pagina">
    <div class="header-acoes">
      <h2>Gestão de Produtos</h2>
      <button mat-raised-button color="primary" (click)="addProduct()">
        <mat-icon>add</mat-icon> Novo Produto
      </button>
    </div>
  
    <mat-form-field appearance="outline" class="filtro-full-width">
      <mat-label>Filtrar Produtos</mat-label>
      <input matInput (keyup)="aplicarFiltro($event)" placeholder="Ex. Nome do Produto" #input>
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  
    <div class="table-responsive">
      <table mat-table [dataSource]="dataSource" matSort>
  
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
          <td mat-cell *matCellDef="let row"> {{row.name}} </td>
        </ng-container>
  
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="center-cell"> Descrição </th>
          <td mat-cell *matCellDef="let row" class="center-cell"> {{row.description}} </td>
        </ng-container>
  
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="center-cell"> Preço </th>
          <td mat-cell *matCellDef="let row" class="center-cell"> {{row.price}} </td>
        </ng-container>
  
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="center-cell"> Estoque </th>
          <td mat-cell *matCellDef="let row" class="center-cell"> {{row.stock}} </td>
        </ng-container>
        <ng-container matColumnDef="acoes" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="center-cell"> Ações </th>
          <td mat-cell *matCellDef="let row" class="center-cell">
            <button mat-icon-button color="accent" title="Editar" (click)="editProduct(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" title="Excluir" (click)="deleteProduct(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="5">Nenhum produto encontrado para o filtro: "{{input.value}}"</td>
        </tr>
      </table>
  
      <mat-paginator 
        [pageSizeOptions]="[5, 10, 25]" 
        aria-label="Selecionar página" 
        [length]="totalRegistros" 
        [pageSize]="pageSize" 
        [pageIndex]="indicePagina" 
        (page)="onPageChange($event)">
      </mat-paginator>
      
    </div>
  </div>
